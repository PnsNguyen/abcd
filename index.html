<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Quiz Ôn tập Web Development</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#dce3ee;--blue:#315ee8;--green:#16804a;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#172554;color:white;padding:24px 18px}header .wrap,main{max-width:850px;margin:auto}h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px}header p{margin:0;color:#dbeafe}
main{padding:22px 16px 50px}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:14px}
.track{height:8px;background:#e0e7f3;border-radius:99px;overflow:hidden;margin:8px 0 20px}.bar{height:100%;background:var(--blue);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 28px #1c31500b}
.kicker{color:var(--blue);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.07em}.question{font-size:clamp(19px,3vw,23px);font-weight:700;white-space:pre-wrap;margin:9px 0 22px}.options{display:grid;gap:10px}.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;color:inherit;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){border-color:#8ba4fa;background:#f8faff}.letter{flex:0 0 28px;height:28px;border-radius:8px;background:#edf1f8;display:grid;place-items:center;font-weight:700;font-size:13px}.opt.correct{border-color:#43a879;background:#effaf4}.opt.correct .letter{background:#16804a;color:white}.opt.wrong{border-color:#df756b;background:#fff3f2}.opt.wrong .letter{background:#c0392b;color:white}.opt:disabled{cursor:default}
.feedback{display:none;margin-top:20px;padding:17px;border-radius:12px;background:#f0f5ff;border:1px solid #d6e2ff}.feedback.show{display:block}.feedback h3{margin:0 0 8px;font-size:17px}.feedback p{margin:6px 0}.good{color:var(--green)}.bad{color:var(--red)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:10px;padding:12px 17px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e8edf6;color:#26334b}.btn:disabled{opacity:.4;cursor:not-allowed}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:14px}.result{display:none;text-align:center}.result.show{display:block}.score{font-size:48px;font-weight:800;color:var(--blue);margin:8px}.hide{display:none!important}code{background:#e9edf5;border-radius:4px;padding:2px 5px;font-size:.92em;overflow-wrap:anywhere}
@media(max-width:520px){header{padding:20px 16px}.card{border-radius:14px}.opt{padding:11px 12px}}
</style></head><body>
<header><div class="wrap"><h1>Web Development Quiz</h1><p>Bộ 131 câu hỏi trắc nghiệm ôn tập Web Development</p></div></header>
<main>
<div class="top"><span id="counter">Câu 1</span><span id="scoreLive">Đúng: 0 / 0 đã trả lời</span></div><div class="track"><div class="bar" id="bar"></div></div>
<section class="card" id="quiz"><div class="kicker" id="kicker">Câu hỏi</div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" id="skip">Bỏ qua</button><button class="btn primary" id="next" disabled>Câu tiếp theo →</button></div><div class="bottom"><span>Chọn một đáp án để xem đáp án đúng và giải thích.</span><button class="btn secondary" id="restartTop">Làm lại / đảo câu</button></div></section>
<section class="card result" id="result"><div class="kicker">Hoàn thành</div><h2>Bạn đã hoàn thành bộ câu hỏi!</h2><div class="score" id="finalScore"></div><p id="finalText"></p><div class="actions" style="justify-content:center"><button class="btn primary" id="again">Làm lại với thứ tự mới</button></div></section>
</main>
<script>
const bank=[{"q": "Với phương thức GET, dữ liệu phản hồi thường có định dạng nào?", "opts": ["TXT/CSV", "HTML/XML", "XML/JSON", "CSV/JSON"], "a": 2, "exp": "API REST trả dữ liệu chủ yếu dưới dạng XML hoặc JSON. JSON hiện phổ biến nhất vì nhẹ và JavaScript parse trực tiếp."}, {"q": "Selector CSS nào chỉ chọn phần tử <li> cuối cùng?", "opts": ["ul:nth-child(last) {}", "ul:last-child li {}", "ul li:last-child {}", "ul:last-child(li) {}"], "a": 2, "exp": "\"ul li:last-child\" chọn <li> là con cuối cùng của cha nó. \"ul:last-child li\" lại chọn mọi <li> trong ul cuối cùng; hai cú pháp còn lại không hợp lệ."}, {"q": "Tính năng then chốt của Node.js để xây dựng REST API là gì?", "opts": ["Truy cập DOM", "Quản lý HTTP request và chức năng phía server", "Xử lý sự kiện phía client", "Quản lý file"], "a": 1, "exp": "Node.js chạy phía server, cung cấp module http (và Express) để nhận request, trả response, định tuyến. DOM và sự kiện client thuộc trình duyệt."}, {"q": "Phần tử inline thường hiển thị mà không xuống dòng mới.", "opts": ["True", "False"], "a": 0, "exp": "Đúng. Phần tử inline (span, a, b, i...) nằm cùng dòng và chỉ chiếm vừa nội dung; block mới xuống dòng."}, {"q": "HTML đúng để chèn ảnh là?", "opts": ["<img href=\"image.gif\" alt=\"My Image\">", "<image src=\"image.gif\" alt=\"My Image\">", "<img alt=\"My Image\">image.gif</img>", "<img src=\"image.gif\" alt=\"My Image\">"], "a": 3, "exp": "Thẻ là <img>, đường dẫn ở thuộc tính src, alt là văn bản thay thế. <img> là thẻ rỗng, không có nội dung/thẻ đóng."}, {"q": "Thuộc tính HTML nào bắt buộc nhập vào ô input?", "opts": ["placeholder", "validate", "formvalidate", "required"], "a": 3, "exp": "\"required\" bắt buộc điền trước khi submit form. placeholder chỉ là gợi ý mờ; validate không tồn tại; formvalidate không phải thuộc tính này."}, {"q": "Thẻ HTML nào định nghĩa stylesheet nội bộ (internal)?", "opts": ["<style>", "<css>", "<sheet type=\"text/css\">", "<script>"], "a": 0, "exp": "CSS nội bộ đặt trong <style> ở <head>. <script> dành cho JavaScript; <css> và <sheet> không tồn tại."}, {"q": "Cặp thẻ nào dùng để liên kết các trang web với nhau?", "opts": ["<link></link>", "<url></url>", "<a></a>", "<hyperlink></hyperlink>"], "a": 2, "exp": "Siêu liên kết dùng thẻ <a> (anchor) kèm href. <link> dùng ở <head> để nhúng tài nguyên như CSS, không phải liên kết cho người dùng bấm."}, {"q": "HTML đúng để tạo hyperlink là?", "opts": ["<a url=\"http://fit.hanu.vn\">fit.hanu.vn</a>", "<a address=\"http://fit.hanu.vn\">HANU FIT</a>", "<a href=\"http://fit.hanu.vn\">FIT</a>", "<a src=\"http://fit.hanu.vn\">http://fit.hanu.vn</a>"], "a": 2, "exp": "Địa chỉ đích của <a> nằm ở thuộc tính href. url, address, src không phải thuộc tính hợp lệ của <a>."}, {"q": "HTML đúng để tạo ô nhập văn bản là?", "opts": ["<input type=\"textfield\">", "<textfield>", "<input type=\"text\">", "<textinput type=\"text\">"], "a": 2, "exp": "Ô nhập văn bản dùng <input type=\"text\">. \"textfield\" không phải giá trị type hợp lệ; <textfield>, <textinput> không tồn tại."}, {"q": "Loại CSS nào viết ngay trong thân trang, như thuộc tính của thẻ HTML?", "opts": ["inline", "embedded", "external", "imported"], "a": 0, "exp": "Inline CSS dùng thuộc tính style trên thẻ, ví dụ <p style=\"color:red\">. Embedded là trong <style>, external là file .css riêng."}, {"q": "Chọn phần tử có id \"demo\" như thế nào?", "opts": [".demo", ":demo", "#demo", "demo"], "a": 2, "exp": "\"#\" chọn theo id, \".\" chọn theo class, \"demo\" (không ký hiệu) chọn thẻ <demo>."}, {"q": "Thuộc tính CSS nào đổi màu chữ?", "opts": ["foreground-color", "text-color", "color", "fgcolor"], "a": 2, "exp": "\"color\" đổi màu chữ. Các tên còn lại không có trong CSS (background-color mới là màu nền)."}, {"q": "Tạo góc bo tròn trong CSS3 bằng cách nào?", "opts": ["border-radius: 8px;", "border [round]: 8px;", "corner-effect: round;", "alpha-effect: round-corner;"], "a": 0, "exp": "CSS3 cung cấp border-radius để bo góc; các lựa chọn khác không tồn tại."}, {"q": "Cái nào KHÔNG phải thuộc tính của Flexbox?", "opts": ["align-items", "justify-spacing", "justify-content", "flex-direction"], "a": 1, "exp": "Flexbox có justify-content (căn theo trục chính), align-items (trục phụ), flex-direction (hướng). \"justify-spacing\" không tồn tại."}, {"q": "Gọi hàm tên myFunction như thế nào?", "opts": ["call function myFunction()", "call myFunction()", "myFunction()", "myFunction.run()"], "a": 2, "exp": "Trong JavaScript, gọi hàm bằng tên hàm kèm cặp ngoặc: myFunction(). Không có từ khóa \"call\"."}, {"q": "Câu lệnh nào gán giá trị 5 cho biến productCost?", "opts": ["productCost <= 5;", "productCost = 5;", "productCost == 5;", "productCost => 5;"], "a": 1, "exp": "\"=\" là toán tử gán. \"<=\" là so sánh nhỏ hơn hoặc bằng, \"==\" so sánh bằng, \"=>\" là arrow function."}, {"q": "Cách viết mảng JavaScript đúng?", "opts": ["let colors = \"red\", \"green\", \"blue\"", "let colors = 1 = (\"red\"), 2 = (\"green\"), 3 = (\"blue\")", "let colors = [\"red\", \"green\", \"blue\"]", "let colors = (1:\"red\", 2:\"green\", 3:\"blue\")"], "a": 2, "exp": "Mảng dùng cặp ngoặc vuông [ ] với các phần tử cách nhau bởi dấu phẩy."}, {"q": "Đặt JavaScript bên trong phần tử HTML nào?", "opts": ["<javascript>", "<script>", "<js>", "<scripting>"], "a": 1, "exp": "Mã JS đặt trong <script>...<\/script> hoặc nạp file qua <script src=\"...\">."}, {"q": "Phương thức nào của window hiển thị thông báo cho người dùng?", "opts": ["alert()", "display()", "message()", "status()"], "a": 0, "exp": "window.alert() hiển thị hộp thoại thông báo. display(), message() không phải phương thức chuẩn của window."}, {"q": "Khi di chuột ra khỏi một liên kết đang hover, trình duyệt phát hiện sự kiện nào?", "opts": ["mouseup", "mouseaway", "mouseoff", "mouseout"], "a": 3, "exp": "\"mouseout\" xảy ra khi con trỏ rời khỏi phần tử. mouseup là nhả nút chuột; mouseaway, mouseoff không tồn tại."}, {"q": "Hàm nào dừng bộ đếm interval?", "opts": ["stopTimer", "clearInterval", "clearTimer", "shutdown Timer"], "a": 1, "exp": "setInterval trả về id; truyền id đó vào clearInterval(id) để dừng. (clearTimeout dùng cho setTimeout.)"}, {"q": "Phương thức HTTP mặc định của hàm fetch là gì?", "opts": ["GET", "Request", "FormData", "POST"], "a": 0, "exp": "fetch(url) mặc định dùng GET. Muốn POST phải chỉ rõ trong options: { method: \"POST\" }."}, {"q": "Mô tả đúng nhất cho x? let x = await fetch(URL);", "opts": ["Một đối tượng Promise", "Một đối tượng được parse từ JSON", "Văn bản phản hồi", "Một đối tượng chứa metadata của phản hồi"], "a": 3, "exp": "fetch trả về Promise, nhưng \"await\" đã chờ nó hoàn tất nên x là đối tượng Response (status, headers, ok...). Muốn lấy dữ liệu phải gọi tiếp await x.json() hoặc x.text()."}, {"q": "Node.js là gì?", "opts": ["Một framework dựa trên Java", "Một framework ứng dụng mạng", "Một web server", "Một framework dựa trên JavaScript"], "a": 1, "exp": "Node.js (đúng ra là môi trường chạy JavaScript trên V8) được thiết kế để xây dựng ứng dụng mạng mở rộng được, theo cơ chế bất đồng bộ. Đáp án theo cách mô tả này (đề dễ nhầm với \"framework JavaScript\")."}, {"q": "Cài package toàn cục bằng npm như thế nào?", "opts": ["npm install -1 <package-name>", "npm global <package-name>", "npm install -g <package-name>", "npm install -global <package-name>"], "a": 2, "exp": "Cờ -g (global) cài package toàn hệ thống: npm install -g <tên>."}, {"q": "Node.js chạy trên?", "opts": ["Client", "Server", "Cả Client và Server", "Browser"], "a": 1, "exp": "Node.js là môi trường chạy JavaScript phía server, không chạy trong trình duyệt."}, {"q": "Callback là gì?", "opts": ["Một hàm được truyền làm đối số cho hàm khác.", "URL của một endpoint backend.", "Một lời gọi API tới backend.", "Phiên bản bất đồng bộ của một hàm."], "a": 0, "exp": "Callback là hàm truyền vào hàm khác để được gọi sau (thường khi tác vụ bất đồng bộ xong)."}, {"q": "Cái nào KHÔNG phải tính năng cốt lõi của Express?", "opts": ["Templating", "Routing", "ORM", "Middleware"], "a": 2, "exp": "Express cốt lõi gồm routing và middleware, hỗ trợ view engine (templating). ORM (Sequelize, Mongoose...) là thư viện riêng."}, {"q": "Truy cập giá trị tham số URL (ví dụ /user/:id) ở đâu?", "opts": ["req.query", "req.params", "req.data", "req.body"], "a": 1, "exp": "Tham số trong đường dẫn nằm ở req.params. req.query là ?key=value, req.body là dữ liệu gửi kèm."}, {"q": "Phục vụ file tĩnh (ảnh, CSS, JS) trong Express dùng gì?", "opts": ["res.sendFile()", "express.static()", "res.sendStatic()", "app.static()"], "a": 1, "exp": "app.use(express.static(\"public\")) là middleware có sẵn để phục vụ file tĩnh. sendFile chỉ gửi một file cụ thể."}, {"q": "Middleware Express nào xử lý dữ liệu JSON từ POST?", "opts": ["express.data()", "express.json()", "express.urlencoded()", "express.parse()"], "a": 1, "exp": "express.json() parse body dạng JSON vào req.body. urlencoded() dùng cho dữ liệu form."}, {"q": "Lấy giá trị một cookie trong request của Express?", "opts": ["req.cookie.value", "req.values.cookieName", "req.get('cookieName')", "req.cookies[cookieName]"], "a": 3, "exp": "Với cookie-parser, các cookie nằm trong đối tượng req.cookies. req.get() đọc header, không phải cookie."}, {"q": "Muốn middleware chạy cho mọi request, đặt ở đâu?", "opts": ["Trong từng route", "Trong file chính của app", "Trước tất cả định nghĩa route", "Sau tất cả định nghĩa route"], "a": 2, "exp": "Express chạy theo thứ tự khai báo, nên middleware dùng app.use() phải đặt trước các route thì mới áp dụng cho chúng."}, {"q": "Phương thức nào ghi nội dung vào file?", "opts": ["fs.write", "fs.output", "fs.writeFile", "fs.writeOut"], "a": 2, "exp": "fs.writeFile(path, data, callback) ghi dữ liệu vào file (tạo mới hoặc ghi đè)."}, {"q": "Module Node nào cần để làm việc với file và thư mục trên server?", "opts": ["os", "fs", "files", "system"], "a": 1, "exp": "\"fs\" (file system) là module có sẵn để đọc, ghi, xóa file/thư mục."}, {"q": "Cái nào KHÔNG phải phương thức HTTP hợp lệ?", "opts": ["HEADER", "PUT", "GET", "POST"], "a": 0, "exp": "Phương thức đúng là HEAD, không phải HEADER. PUT, GET, POST đều hợp lệ."}, {"q": "JSX viết tắt của?", "opts": ["JavaScript executable", "JavaScript XML", "JointScript XML", "JavaScreenXML"], "a": 1, "exp": "JSX = JavaScript XML, cú pháp giống HTML viết trong JavaScript cho React."}, {"q": "Trong React, các component kết hợp để tạo giao diện bằng cách nào?", "opts": ["Đặt trong cấu trúc thư mục", "Lồng nhau (nesting)", "Dùng webpack", "Code splitting"], "a": 1, "exp": "Component cha chứa component con trong JSX, tạo thành cây component."}, {"q": "Hook trong React là gì?", "opts": ["Giúp dùng state và hành vi vòng đời trong functional component", "Giúp tùy biến một component", "Giúp gắn component vào sự kiện", "Giúp tạo vòng đời cho component"], "a": 0, "exp": "Hook (useState, useEffect...) cho phép function component có state và xử lý lifecycle mà không cần class."}, {"q": "Thẻ <></> trong React gọi là gì?", "opts": ["Grouper", "Empty", "Fragment", "Shard"], "a": 2, "exp": "Đó là Fragment, nhóm nhiều phần tử con mà không thêm node DOM thừa."}, {"q": "React chỉ có thể render phần tử trong phần tử root của tài liệu.", "opts": ["True", "False"], "a": 1, "exp": "Sai về mặt kỹ thuật: createRoot có thể gắn vào bất kỳ phần tử DOM nào, và một trang có thể có nhiều root (còn có Portal). Lưu ý: giáo trình có thể dạy \"root\" là chỗ render chính."}, {"q": "Chọn thẻ HTML tốt nhất để định nghĩa chữ nghiêng.", "opts": ["<strong>", "<ca>", "<b>", "<i>"], "a": 3, "exp": "<i> in nghiêng (thẻ <em> cũng nhấn mạnh). <strong> và <b> là in đậm."}, {"q": "Một bản ghi dữ liệu trong MongoDB gọi là gì?", "opts": ["Collection", "Document", "Row", "Table"], "a": 1, "exp": "MongoDB lưu dữ liệu dạng document (JSON/BSON); nhiều document tạo thành collection. Row/Table là thuật ngữ SQL."}, {"q": "Dòng code nào chạy được trong NodeJS?", "opts": ["const button = document.querySelector(\"button\");", "console.log(\"VS\");", "const name VB;", "None of these"], "a": 1, "exp": "console.log chạy được trong Node. \"document\" là DOM của trình duyệt nên Node không có; \"const name VB;\" sai cú pháp."}, {"q": "Lệnh nào trong mongo shell hiển thị mọi collection của database đang chọn?", "opts": ["show db -all", "show collections", "show databases", "show dbs"], "a": 1, "exp": "\"show collections\" liệt kê collection trong DB hiện tại. \"show dbs\"/\"show databases\" liệt kê các database."}, {"q": "Cách nào đúng để khai báo mảng trong JavaScript?", "opts": ["int[] list = new int[]{1,2,3);", "let list = [1,2,3];", "const list = (1,2,3);", "int[] list = new Array(1,2,3);"], "a": 1, "exp": "JavaScript không khai báo kiểu như Java; dùng let/const với [ ]. Ngoặc tròn (1,2,3) chỉ trả về giá trị cuối là 3."}, {"q": "Cú pháp JavaScript đúng để đổi nội dung đoạn sau thành Hello World?", "opts": ["document.querySelector(\"#demo\").innerHTML= \"Hello World!\";", "document.querySelectorAll(\",demo\").textContent = \"Hello World!\";", "document.querySelectorAll(\"#demo\").textContent = \"Hello World!\";", "document.querySelector(\".demo\").innerHTML = \"Hello World!\";"], "a": 0, "exp": "\"#demo\" chọn theo id và querySelector trả về một phần tử để gán innerHTML. querySelectorAll trả về danh sách nên không gán textContent trực tiếp; \".demo\" là class; \",demo\" sai selector."}, {"q": "Trong ReactJS, state có thể dùng để truyền...", "opts": ["Event handler cho component", "None of these", "Both of these", "Properties cho component"], "a": 1, "exp": "State là dữ liệu nội bộ của component; việc truyền dữ liệu hay event handler cho component con được thực hiện qua props. Lưu ý: đề có thể gốc là \"props\" (khi đó đáp án là Both of these)."}, {"q": "Điều nào đúng về phần tử block trong HTML?", "opts": ["Ít nội dung, không có height/width", "Ít nội dung, có height và width", "Chiếm toàn bộ chiều rộng trang (xếp từ trên xuống)", "Khối nội dung lớn, có height và width"], "a": 2, "exp": "Phần tử block (div, p, h1...) bắt đầu dòng mới và mặc định chiếm hết chiều ngang của phần tử cha."}, {"q": "Câu lệnh nào thực thi mã trong abc.js?", "opts": ["node abc.js", "None of these", "abc.js", "nodejs abc"], "a": 0, "exp": "Chạy file bằng \"node tên_file.js\"."}, {"q": "Cái nào là sự kiện dựng sẵn hợp lệ trong JavaScript?", "opts": ["onSubmit", "click", "onClick", "onChange"], "a": 1, "exp": "Tên sự kiện chuẩn là \"click\" (dùng với addEventListener(\"click\")). onClick/onSubmit/onChange là tên thuộc tính HTML hoặc cú pháp JSX của React."}, {"q": "Khi props của component React thay đổi, component sẽ:", "opts": ["Không làm gì, phải gọi render", "Được tạo lại từ đầu", "Re-render component", "None of these"], "a": 2, "exp": "React tự động re-render khi props hoặc state đổi, không cần gọi render thủ công."}, {"q": "Cái nào là template engine của Node.js?", "opts": ["Mongoose", "Handlebars", "None of these", "ReactJS"], "a": 1, "exp": "Handlebars (cùng EJS, Pug) là template engine. Mongoose là ODM cho MongoDB; React là thư viện UI."}, {"q": "componentDidMount() được gọi khi:", "opts": ["Component render lần đầu", "Cả hai", "State của component được cập nhật", "None of these"], "a": 0, "exp": "componentDidMount chạy một lần, ngay sau khi component được render lần đầu vào DOM. Cập nhật state kích hoạt componentDidUpdate."}, {"q": "Biến, hàm trong module Node.js được xuất ra bằng:", "opts": ["module", "module.expose", "module.exports", "All of them"], "a": 2, "exp": "Dùng module.exports (hoặc exports) để các file khác require() được."}, {"q": "Thư viện npm nào dùng để đọc/ghi MongoDB từ NodeJS?", "opts": ["mongod", "mongodb", "MongoClient", "mongo"], "a": 1, "exp": "Driver chính thức là package \"mongodb\" (MongoClient là một lớp bên trong). \"mongod\" là tiến trình server MongoDB."}, {"q": "Trong vòng đời component React, vị trí tốt nhất để gọi API lấy dữ liệu là?", "opts": ["constructor", "getDerivedStateFromProps", "componentDidMount", "render"], "a": 2, "exp": "componentDidMount chạy sau khi component đã gắn vào DOM, một lần duy nhất. render phải thuần khiết nên không gọi API ở đó."}, {"q": "Cách nào KHÔNG được ưu tiên để giao tiếp giữa App (có danh sách Present) và Present?", "opts": ["Present phát custom event, App lắng nghe rồi gọi phương thức tương ứng", "Đưa tham chiếu App vào constructor của Present để Present gọi phương thức của App", "App gọi trực tiếp phương thức của Present vì App giữ danh sách Present", "App truyền phương thức làm tham số cho Present, Present gọi khi có hành động"], "a": 1, "exp": "Cho con giữ tham chiếu tới cha tạo phụ thuộc vòng, gắn chặt hai lớp (tight coupling). Các cách còn lại là chuẩn: cha gọi con, cha truyền callback, hoặc dùng sự kiện."}, {"q": "Điều nào KHÔNG được khuyến nghị để làm website responsive?", "opts": ["Dùng media query cho các độ rộng màn hình khác nhau", "Luôn thêm thẻ meta viewport", "Với font, ưu tiên px", "Với height và width, ưu tiên phần trăm"], "a": 2, "exp": "Đơn vị px cố định, không co giãn; nên dùng em/rem/% cho font. Các điều còn lại đều là thực hành responsive tốt."}, {"q": "React là:", "opts": ["Thư viện JavaScript", "None of these", "Framework JavaScript", "Cả hai"], "a": 0, "exp": "React tự mô tả là thư viện JavaScript để xây dựng UI (không bao gồm routing hay quản lý dữ liệu như framework đầy đủ)."}, {"q": "Vị trí ưu tiên để nhúng file JS ngoài trong tài liệu HTML là?", "opts": ["Đầu phần <body>", "Cuối phần <body>", "Cuối tài liệu", "Trong <head>"], "a": 1, "exp": "Đặt script cuối <body> để HTML tải xong trước, không chặn hiển thị và DOM đã sẵn sàng khi script chạy. (Ở <head> chỉ tốt khi dùng defer.)"}, {"q": "Kết quả đoạn code sau?", "opts": ["5 ảnh trên 1 dòng, mỗi ảnh 200px", "5 ảnh trên 5 dòng, mỗi ảnh 50px", "5 ảnh trên 5 dòng, mỗi ảnh 200px", "5 ảnh trên 1 dòng, mỗi ảnh 50px"], "a": 2, "exp": "display:block làm mỗi ảnh chiếm một dòng riêng; width:200px đặt chiều rộng mỗi ảnh là 200px."}, {"q": "Kết quả CSS sau?", "opts": ["Khoảng cách từ viền tới nội dung: trên & dưới 10px, trái & phải 5px", "Trên & dưới 5px, trái & phải 10px", "Trên & phải 10px, dưới & trái 5px", "Trên & trái 5px, dưới & phải 10px"], "a": 0, "exp": "Với 2 giá trị, giá trị đầu là trên/dưới, giá trị sau là trái/phải."}, {"q": "HTML đúng để tạo liên kết nội bộ (cùng trang) tới bookmark tên css?", "opts": ["<a href=\"#css\">Lession 2. CSS</a>", "<link href=\"css\">Lession 2. CSS</a>", "<a name=\"css\">Lession 2. CSS</a>", "<a id=\"css\">Lession 2. CSS</a>"], "a": 0, "exp": "Liên kết tới vị trí cùng trang dùng href=\"#id\". Hai dòng cuối là cách tạo đích (bookmark), không phải liên kết."}, {"q": "Thẻ <noscript> trong HTML dùng để định nghĩa điều gì?", "opts": ["Nội dung hiển thị khi scripting bị tắt", "Đoạn script chạy khi scripting được bật", "Không cho phép nội dung script trong tài liệu", "Không cho phép nội dung script trong phần (section) đó"], "a": 0, "exp": "<noscript> chứa nội dung thay thế, chỉ hiển thị khi trình duyệt không hỗ trợ hoặc người dùng đã tắt JavaScript."}, {"q": "Gửi POST request dạng urlencoded bằng fetch như thế nào?", "opts": ["fetch(URL, {method: 'POST', 'Content-Type': {'application': 'x-www-form-urlencoded'}})", "fetch(URL, {method: 'POST', 'Content-Type': 'application/x-www-form-urlencoded'})", "fetch(URL, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}})", "fetch(URL, {method: 'POST', headers: ('Content-Type': 'application/x-www-form-urlencoded')})"], "a": 2, "exp": "Header phải nằm trong thuộc tính headers, là một object { 'Content-Type': 'application/x-www-form-urlencoded' }. Đặt Content-Type thẳng trong options hoặc dùng ngoặc tròn đều sai cú pháp."}, {"q": "Thuộc tính CSS nào xác định khoảng trống BÊN TRONG viền (border) của phần tử?", "opts": ["content-spacing", "margin", "spacing", "padding"], "a": 3, "exp": "padding là khoảng cách giữa nội dung và border; margin là khoảng trống bên ngoài border."}, {"q": "Chỉ định khoảng cách giữa các cột trong bố cục nhiều cột (multi-column) bằng thuộc tính nào?", "opts": ["gap", "column-space", "column-spacing", "column-gap"], "a": 3, "exp": "column-gap xác định khoảng cách giữa các cột; dùng được trong multi-column, grid và flexbox."}, {"q": "Làm sao để chữ của một phần tử KHÔNG xuống dòng và nằm trên một dòng?", "opts": ["white-space: no-wrap;", "text-wrap: nowrap;", "text-overflow: nowrap;", "white-space: nowrap;"], "a": 3, "exp": "white-space: nowrap ngăn văn bản tự xuống dòng. \"no-wrap\" (có gạch nối) không hợp lệ, còn text-overflow dùng để xử lý chữ tràn (ví dụ ellipsis)."}, {"q": "Tệp cấu hình nào chứa danh sách dependencies của một dự án Node.js?", "opts": ["package.json", "config.json", "manifest.json", "pom.xml"], "a": 0, "exp": "package.json chứa metadata, scripts và dependencies của dự án Node.js. pom.xml là của Maven (Java)."}, {"q": "Hàm next() trong middleware của Express làm gì?", "opts": ["Kết thúc chu trình response", "Ném ra lỗi", "Khởi động lại chu trình request-response", "Chuyển quyền điều khiển cho middleware tiếp theo"], "a": 3, "exp": "next() chuyển quyền xử lý sang middleware hoặc route handler kế tiếp trong chuỗi xử lý request."}, {"q": "Tạo hiệu ứng chuyển tiếp (transition) trong CSS bằng thuộc tính nào?", "opts": ["transform", "transition-effect", "transition", "animation"], "a": 2, "exp": "transition tạo hiệu ứng chuyển mượt giữa hai trạng thái CSS. transform biến đổi hình học, animation dùng với @keyframes."}, {"q": "Thuộc tính nào dùng để điều khiển THỨ TỰ của các flex item?", "opts": ["item-order", "order", "flex-order", "flex-item-order"], "a": 1, "exp": "order quyết định thứ tự xuất hiện của các phần tử trong flex container (giá trị nhỏ hơn đứng trước)."}, {"q": "Thẻ nào của HTML5 dùng để định nghĩa phần chứa nội dung phụ, tách biệt với nội dung chính?", "opts": ["<aside>", "<section>", "<sidebar>", "<div>"], "a": 0, "exp": "<aside> dành cho nội dung phụ như sidebar, quảng cáo, chú thích. HTML không có thẻ <sidebar>."}, {"q": "Cặp thẻ nào dùng để tạo một vùng cấu trúc (structural area) trên trang web?", "opts": ["<cite></cite>", "<div></div>", "<area></area>", "<strong></strong>"], "a": 1, "exp": "<div> dùng để chia bố cục, gom nhóm các phần tử rồi định dạng bằng CSS."}, {"q": "Trong Express, gửi status 404 kèm thông báo \"Not Found\" như thế nào?", "opts": ["res.status(404).send('Not Found')", "res.sendStatus(404, 'Not Found')", "res.send(404, 'Not Found')", "res.status(404).message('Not Found')"], "a": 0, "exp": "res.status(404) đặt mã trạng thái rồi .send() gửi nội dung. sendStatus chỉ nhận mã (không nhận thông báo), res.send(404, ...) là cú pháp cũ đã bị loại bỏ, còn .message() không tồn tại."}, {"q": "Trong ứng dụng thương mại điện tử, request POST thường được dùng để làm gì?", "opts": ["Đặt hàng", "Xóa tài khoản", "Cập nhật thông tin người dùng", "Lấy thông tin sản phẩm"], "a": 0, "exp": "POST dùng để tạo/gửi dữ liệu mới lên server, ví dụ tạo đơn hàng. Xóa dùng DELETE, cập nhật dùng PUT/PATCH, lấy dữ liệu dùng GET."}, {"q": "Làm thế nào để kết nối (dùng) một module trong module khác ở Node.js?", "opts": ["Tunnel", "Pipeline", "Expose", "Exports"], "a": 3, "exp": "Module chia sẻ chức năng qua exports (module.exports) và module khác nạp lại bằng require(). Tunnel, Pipeline, Expose không phải cơ chế của Node.js."}, {"q": "Chạy một file Node.js từ dòng lệnh bằng cách nào?", "opts": ["node <filename.js>", "npm run <filename.js>", "run <filename.js>", "node start <filename.js>"], "a": 0, "exp": "Dùng lệnh node <filename.js>. npm run chạy script khai báo trong package.json, không chạy trực tiếp file."}, {"q": "Thuộc tính nào dùng để đổi phông chữ (font) của phần tử?", "opts": ["font-weight", "font-style", "font-face", "font-family"], "a": 3, "exp": "font-family chọn phông chữ. font-weight là độ đậm, font-style là kiểu nghiêng, @font-face dùng để khai báo phông tùy chỉnh."}, {"q": "Trong JavaScript, hiển thị hộp thoại cảnh báo với nội dung \"Hello World\" bằng cách nào?", "opts": ["alert(\"Hello World\");", "msg(\"Hello World\");", "alertBox(\"Hello World\");", "msgBox(\"Hello World\");"], "a": 0, "exp": "window.alert() là hàm chuẩn để hiển thị hộp thoại thông báo."}, {"q": "Đoạn CSS nào đặt màu nền #00CED1 cho trang web?", "opts": ["body {background-color: #00CED1;}", "document {bgcolor: #00CED1;}", "document {background: #00CED1;}", "body {bgcolor: #00CED1;}"], "a": 0, "exp": "Màu nền của trang đặt trên thẻ body bằng background-color. \"document\" không phải selector hợp lệ và bgcolor không phải thuộc tính CSS."}, {"q": "Module nào trong các lựa chọn sau được dùng để tạo HTTP server?", "opts": ["fs", "express", "multer", "nodemon"], "a": 1, "exp": "Trong danh sách này chỉ có express dùng để tạo HTTP server (bản thân Express dựa trên module http của Node). fs làm việc với file, multer xử lý upload file, nodemon tự khởi động lại server khi code đổi."}, {"q": "Làm sao để một phần tử chỉ chiếm chiều rộng TỐI THIỂU mà nó cần?", "opts": ["width: auto;", "width: max-content;", "width: min-content;", "width: fit-content;"], "a": 2, "exp": "min-content là chiều rộng nhỏ nhất mà nội dung có thể co lại tới (ngắt dòng tại mọi chỗ có thể). max-content là rộng nhất, fit-content nằm giữa hai giá trị đó và phụ thuộc vùng chứa. Lưu ý: đề gốc không đánh dấu đáp án; nếu thầy/cô ra theo ý \"vừa khít nội dung\" thì đáp án có thể là fit-content, bạn nên đối chiếu lại."}, {"q": "Làm sao để ảnh trở nên responsive trong CSS?", "opts": ["max-height: 100%;", "width: 100%;", "height: auto;", "max-width: 100%;"], "a": 3, "exp": "max-width: 100% (thường kèm height: auto) giúp ảnh không bao giờ vượt quá chiều rộng của vùng chứa và co lại theo màn hình."}, {"q": "Kết quả in ra của đoạn code sau là gì?", "opts": ["Success 1", "Success 1", "Success 1", "Error"], "a": 3, "exp": "Promise bị reject nên hai .then() bị bỏ qua, chỉ khối .catch() chạy và in \"Error\"."}, {"q": "Kết quả của đoạn code sau là gì?", "opts": ["0", "3", "Error", "undefined"], "a": 0, "exp": "Lưu ý: file đề ghi đáp án là \"Error\", nhưng khi chạy thực tế bằng Node thì in ra 0. Lý do: vòng lặp bắt đầu với i = 5 (lẻ) nên count++ không chạy, và lệnh return count nằm TRONG vòng lặp nên hàm trả về 0 ngay ở lần lặp đầu, trước khi i++ (sẽ gây TypeError vì i là const) kịp thực thi. Bạn nên hỏi lại giáo viên nếu đề thật ghi khác."}, {"q": "Kết quả của đoạn code sau là gì?", "opts": ["3", "5", "Error", "1"], "a": 3, "exp": "Toán tử === so sánh cả kiểu dữ liệu, nên chỉ có số 0 (kiểu number) thỏa; '0' (chuỗi) và false không bằng."}, {"q": "Cách nào đúng để bật/tắt (toggle) hiển thị của div nội dung?", "opts": ["this.content.classList.add(\"hidden\");", "this.content.classList.toggle(\"hidden\");", "this.target.classList.toggle(\"hidden\");", "this.target.classList.remove(\"hidden\");"], "a": 2, "exp": "Constructor lưu phần tử vào this.target (không có this.content). classList.toggle() bật/tắt class .hidden mỗi lần bấm, còn add/remove chỉ làm một chiều."}, {"q": "Kết quả hiển thị của đoạn React sau là gì?", "opts": ["\"My Favorite Color is red\"", "\"My Favorite Color is red\", sau 1 giây đổi thành \"My Favorite Color is yellow\"", "\"My Favorite Color is yellow\"", "Lỗi"], "a": 2, "exp": "Lần render đầu là \"red\", nhưng componentDidMount chạy ngay sau đó và setState sang \"yellow\" khiến React render lại trước khi trình duyệt kịp vẽ, nên kết quả người dùng thấy là \"yellow\". Không có độ trễ 1 giây nào trong code (đề gốc giải thích hơi lẫn lộn ở câu này)."}, {"q": "Đoạn lỗi sau xuất hiện khi chạy code. Đây là lỗi gì?", "opts": ["Cổng 3000 đang bị ứng dụng (tiến trình) khác sử dụng", "Tiến trình MongoDB không chạy ở cổng 27017", "Không có lựa chọn nào đúng", "Database tên 'blog-db' không tồn tại"], "a": 0, "exp": "EADDRINUSE nghĩa là địa chỉ/cổng đã được dùng. Hãy tắt tiến trình đang chiếm cổng 3000 hoặc đổi sang cổng khác. Nếu MongoDB không chạy thì lỗi sẽ là không kết nối được tới 27017, và MongoDB tự tạo database khi ghi dữ liệu nên không báo \"không tồn tại\"."}, {"q": "Đoạn JS nào gọi đúng API được định nghĩa trong server ExpressJS sau?", "opts": ["const response = await fetch('/hello?name=' + encodeURI(name), { method: 'POST' });", "const response = await fetch('/hello/{$name}');", "const response = await fetch('/hello', {", "const response = await fetch('/hello/' + encodeURIComponent(name));"], "a": 3, "exp": "Route là GET /hello/:name nên client phải gọi GET tới /hello/<name> (fetch mặc định là GET) và đọc kết quả bằng response.json(). Các phương án khác dùng sai method (POST), sai URL (query thay vì path param) hoặc sai cú pháp."}, {"q": "Cần sửa bao nhiêu lỗi trong đoạn code sau để chạy không lỗi?", "opts": ["3", "1", "Không có lỗi", "2"], "a": 2, "exp": "Code hợp lệ: constructor gắn sự kiện click cho nút, _onClick được bind đúng this, và button.click() kích hoạt alert('Hello!')."}, {"q": "Câu lệnh require() trong Node.js dùng để làm gì?", "opts": ["Nạp (load) một module", "Tạo một module mới", "Biên dịch một module", "Xóa một module"], "a": 0, "exp": "require() (CommonJS) nạp module từ file khác, thư viện có sẵn của Node hoặc thư mục node_modules."}, {"q": "Phương thức nào của Express dùng để gắn (mount) một middleware?", "opts": ["app.use()", "app.all()", "app.middleware()", "app.mount()"], "a": 0, "exp": "app.use() đăng ký middleware vào chuỗi xử lý request của ứng dụng. app.all() gắn handler cho mọi HTTP method của một route; hai phương thức còn lại không tồn tại."}, {"q": "Trong Node.js, xử lý lỗi xảy ra trong thao tác bất đồng bộ của mysql2 (dùng async/await) như thế nào?", "opts": ["Lỗi mặc định được ghi ra console", "Viết một middleware xử lý lỗi tùy chỉnh", "Hàm query() tự động xử lý lỗi", "Dùng khối try...catch"], "a": 3, "exp": "Với async/await (hoặc Promise), cách chuẩn để bắt lỗi truy vấn là try...catch. Lỗi không tự được log, query() cũng không tự xử lý lỗi cho bạn."}, {"q": "Cách làm phổ biến để ngăn tấn công SQL injection khi dùng MySQL là gì?", "opts": ["Để database server tự lo bảo mật", "Tránh dùng dữ liệu người dùng trong câu lệnh SQL", "Dùng truy vấn có tham số (parameterized queries)", "Tự làm sạch dữ liệu người dùng bằng tay"], "a": 2, "exp": "Truy vấn có tham số (placeholder ?) tách hẳn mã SQL khỏi dữ liệu nhập, loại bỏ nguy cơ SQL injection. Tự lọc bằng tay dễ sót, còn tránh dùng input thì không thực tế."}, {"q": "Cấu trúc dữ liệu chính của MongoDB là gì?", "opts": ["Document", "Cặp key-value", "Bảng (table)", "Đồ thị (graph)"], "a": 0, "exp": "MongoDB là CSDL NoSQL hướng tài liệu: dữ liệu lưu thành các document dạng BSON/JSON, gom thành collection."}, {"q": "Dùng module mongodb, làm sao để đổi giá trị của MỘT trường trong document?", "opts": ["collection.updateOne(filter, { $update: { field: value } })", "collection.updateOne(filter, { $set: { field: value } })", "collection.updateOne(filter, { $change: { field: value } })", "collection.updateOne(filter, { $modify: { field: value } })"], "a": 1, "exp": "Toán tử $set gán giá trị mới cho trường chỉ định mà không ghi đè các trường khác. $update, $change, $modify không tồn tại."}, {"q": "Trong MongoDB, toán tử nào dùng để đổi tên một trường trong document?", "opts": ["$changeName", "$setFieldName", "$setName", "$rename"], "a": 3, "exp": "$rename đổi tên một hoặc nhiều trường sang tên mới."}, {"q": "Biểu thức JSX nào sau đây KHÔNG hợp lệ?", "opts": ["<div class=\"my-class\">Hello, world!</div>", "<p>{1 + 2}</p>", "<div> <p>This is a paragraph.</p> <p>This is another paragraph.</p> </div>", "<MyComponent prop1=\"value1\" prop2=\"{myFunction}\"/>"], "a": 0, "exp": "Trong JSX phải dùng className thay cho class (vì class là từ khóa của JavaScript). Lưu ý: file đề 2025 đánh dấu nhầm đáp án là phương án C, trong khi bản đề 2024 và quy tắc JSX đều cho đáp án là dùng class."}, {"q": "Thêm class cho một phần tử JSX bằng cách nào?", "opts": ["<div className={myClass}></div>", "<div class=\"myClassName\"></div>", "<div class=\"myClass\"></div>", "<div className=\"myClass\"></div>"], "a": 3, "exp": "JSX dùng thuộc tính className. Đáp án chuẩn của đề là className=\"myClass\" (chuỗi cố định); phương án A cũng chạy được nếu đã khai báo biến myClass, còn class=... thì không hợp lệ."}, {"q": "Trong lệnh: npx create-react-app my-react-app, \"my-react-app\" chỉ điều gì?", "opts": ["Tham chiếu tới một app có sẵn", "Loại app cần tạo", "Template dùng để tạo app", "Thư mục sẽ tạo app mới"], "a": 3, "exp": "Tham số cuối là tên thư mục (và tên dự án) mà create-react-app sẽ tạo và cài đặt dự án vào."}, {"q": "Cách dùng câu lệnh điều kiện đúng trong EJS là gì?", "opts": ["<%= if(user) { %> <p>Welcome</p> <%= } %>", "<% if(user) { %> <p>Welcome</p> <% } %>", "<% if user %> <p>Welcome</p> <% endif %>", "<%- if(user) { %> <p>Welcome</p> <%- } %>"], "a": 1, "exp": "Lệnh điều khiển luồng (if, for...) đặt trong <% %>. <%= %> in giá trị đã escape HTML, <%- %> in HTML thô (không escape)."}, {"q": "Ưu điểm chính của mysql2/promise so với mysql2 thông thường là gì?", "opts": ["API đơn giản hơn cho thao tác đồng bộ", "Hỗ trợ tính năng nâng cao như stored procedure và trigger", "Hiệu năng tốt hơn với tập dữ liệu lớn", "Cho phép thao tác bất đồng bộ với Promise, code gọn và không chặn (non-blocking)"], "a": 3, "exp": "mysql2/promise trả về Promise nên dùng được async/await, tránh \"callback hell\". Stored procedure/trigger là tính năng của MySQL chứ không phải của wrapper này."}, {"q": "Về tính nhất quán dữ liệu, phát biểu nào đúng khi so sánh MySQL với MongoDB?", "opts": ["MySQL mặc định đảm bảo strong consistency", "Cả MySQL và MongoDB đều đảm bảo strong consistency", "MongoDB mặc định đảm bảo strong consistency", "MySQL cung cấp eventual consistency"], "a": 0, "exp": "MySQL là RDBMS theo mô hình ACID nên mặc định nhất quán mạnh. Theo đề, MongoDB thuộc nhóm NoSQL thường ưu tiên khả năng sẵn sàng và mở rộng (eventual consistency)."}, {"q": "Cho dữ liệu { items: ['Apple', 'Banana', 'Orange'] }. Template Handlebars nào lặp đúng qua mảng?", "opts": ["{{items.map}}<li>{{value}}</li>{{/items.map}}", "{{#for items}}<li>{{this}}</li>{{/for}}", "{{#each items}}<li>{{this}}</li>{{/each}}", "{{#loop items}}<li>{{item}}</li>{{/loop}}"], "a": 2, "exp": "Handlebars dùng helper {{#each mảng}}...{{/each}}, và {{this}} là phần tử hiện tại của mỗi vòng lặp."}, {"q": "Quy tắc nào KHÔNG hợp lệ khi dùng React Hooks?", "opts": ["Hooks có thể được gọi có điều kiện (conditionally)", "Hooks phải được gọi bên trong function component", "Hooks không thể dùng trong class component", "Hooks phải được gọi ở cấp cao nhất (top level) của hàm"], "a": 0, "exp": "Không được gọi Hook trong if, vòng lặp hay hàm lồng nhau, để thứ tự gọi Hook giống nhau ở mọi lần render."}, {"q": "\"Unidirectional data flow\" (luồng dữ liệu một chiều) trong React nghĩa là gì?", "opts": ["Dữ liệu chảy từ component con lên component cha", "Dữ liệu có thể chảy theo mọi hướng giữa các component", "Dữ liệu chỉ chảy từ component cha xuống component con", "Dữ liệu được chia sẻ toàn cục cho mọi component"], "a": 2, "exp": "Dữ liệu đi một chiều từ cha xuống con qua props; component con không sửa trực tiếp props mà phải gọi hàm do cha truyền xuống."}, {"q": "Điều gì xảy ra nếu dùng <%= '<script>alert(\"XSS\")<\/script>' %> trong template EJS?", "opts": ["Hiển thị đoạn văn bản <script>alert(\"XSS\")<\/script> dưới dạng HTML đã được escape", "Ném ra lỗi", "Render một thẻ script rỗng", "Thực thi đoạn JavaScript alert"], "a": 0, "exp": "<%= %> tự động escape ký tự HTML đặc biệt (<, >...), nên đoạn script chỉ hiện như văn bản và không chạy, giúp phòng tránh XSS. Muốn in HTML thô phải dùng <%- %>."}, {"q": "Muốn dùng đuôi file khác (như .hbs) cho template Handlebars thì cấu hình thế nào?", "opts": ["Handlebars.extension = 'hbs';", "app.set('view engine', 'hbs');", "Đổi tên mọi file, không cần cấu hình", "app.set('template extension', 'hbs');"], "a": 1, "exp": "Dùng app.set('view engine', 'hbs') để Express biết engine và đuôi mặc định của view."}, {"q": "Quy tắc nào KHÔNG phải là quy tắc của React Hooks?", "opts": ["Hooks chỉ được gọi ở cấp cao nhất của component", "Hooks có thể được gọi trong class component hoặc function component", "Hooks chỉ được gọi bên trong React function component", "Hooks không được gọi có điều kiện"], "a": 1, "exp": "Hooks chỉ dùng được trong function component (hoặc custom Hook), không dùng được trong class component."}, {"q": "Mục đích chính của JSX là gì?", "opts": ["Tăng hiệu năng của JavaScript", "Thuận tiện đưa cấu trúc giống HTML vào trong code JavaScript", "Tạo các thẻ HTML tùy chỉnh", "Cho phép render phía server các component React"], "a": 1, "exp": "JSX là cú pháp mở rộng cho phép viết cấu trúc giống HTML ngay trong JavaScript; nó không nhằm tăng hiệu năng hay bật SSR."}, {"q": "Trong route Express sau, template EJS sẽ có những gì?", "opts": ["Cả username và age như hai biến riêng", "Một object tên data chứa username và age", "Chỉ age", "Chỉ username"], "a": 0, "exp": "Các thuộc tính của object truyền vào res.render() trở thành biến độc lập (username, age) dùng trực tiếp trong template."}, {"q": "Đoạn sau sẽ xuất ra gì nếu user là undefined?", "opts": ["Một lỗi được ném ra", "Chuỗi rỗng", "Welcome", "Welcome undefined"], "a": 0, "exp": "Truy cập thuộc tính của undefined (user.name) gây lỗi runtime (TypeError), nên template không render được."}, {"q": "Công nghệ nào thường dùng để xây dựng Single-Page Application (SPA)?", "opts": ["PHP", "WordPress", "React.js", "ASP.NET"], "a": 2, "exp": "React.js là thư viện front-end phổ biến để xây SPA, giao diện được cập nhật động mà không tải lại cả trang."}, {"q": "Partials trong Handlebars có mục đích gì?", "opts": ["Tạo các hàm helper tùy chỉnh", "Chia code JavaScript thành các module", "Render một phần trang cho AJAX request", "Tái sử dụng các đoạn template trong nhiều view"], "a": 3, "exp": "Partial là mảnh template nhỏ (navbar, footer...) chèn vào nhiều view để tránh lặp code."}, {"q": "Trong Express.js, chuyển hướng người dùng sang trang khác bằng cách nào?", "opts": ["res.redirect('/new-url')", "res.send('/new-url')", "app.redirect('/new-url')", "res.render('/new-url')"], "a": 0, "exp": "res.redirect() gửi phản hồi HTTP redirect để trình duyệt chuyển san let order=[],pos=0,answered=new Map(),score=0;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle(bank.map((_,i)=>i));pos=0;answered=new Map();score=0;$('quiz').classList.remove('hide');$('result').classList.remove('show');render()}
function render(){
 if(pos>=order.length){finish();return}
 const q=bank[order[pos]];$('counter').textContent=`Câu ${pos+1} / ${order.length}`;$('kicker').textContent=`Câu hỏi ${pos+1}`;$('question').textContent=q.q;$('options').innerHTML='';$('feedback').className='feedback';$('feedback').innerHTML='';$('next').disabled=true;$('next').textContent=pos===order.length-1?'Xem kết quả':'Câu tiếp theo →';$('skip').disabled=false;
 q.opts.forEach((opt,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span>`;b.onclick=()=>choose(i);$('options').appendChild(b)});
 $('bar').style.width=(pos/order.length*100)+'%';updateScore()
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(i){if(answered.has(order[pos]))return;const q=bank[order[pos]],correct=i===q.a;answered.set(order[pos],i);if(correct)score++;
 [...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===i&&!correct)b.classList.add('wrong')});
 $('feedback').className='feedback show';$('feedback').innerHTML=`<h3 class="${correct?'good':'bad'}">${correct?'✓ Chính xác!':'✗ Chưa chính xác.'} Đáp án đúng: ${String.fromCharCode(65+q.a)}.</h3><p><strong>Đáp án:</strong> ${escapeHtml(q.opts[q.a])}</p><p><strong>Giải thích chi tiết:</strong> ${escapeHtml(q.exp)}</p>`;$('next').disabled=false;$('skip').disabled=true;updateScore()
}
function updateScore(){$('scoreLive').textContent=`Đúng: ${score} / ${answered.size} đã trả lời`}
function next(){pos++;render()}
function finish(){$('quiz').classList.add('hide');$('result').classList.add('show');$('bar').style.width='100%';$('counter').textContent='Đã hoàn thành';$('scoreLive').textContent=`Đúng: ${score} / ${answered.size} đã trả lời`;$('finalScore').textContent=`${score} / ${bank.length}`;$('finalText').textContent=`Bạn đã trả lời ${answered.size} trên ${bank.length} câu. Tỷ lệ đúng trên số câu đã trả lời: ${answered.size?Math.round(score/answered.size*100):0}%.`;}
$('next').onclick=next;$('skip').onclick=()=>{pos++;render()};$('restartTop').onclick=start;$('again').onclick=start;start();
</script></body></html>
