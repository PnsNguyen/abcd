<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Quiz Ôn tập Web Development</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#dce3ee;--blue:#315ee8;--green:#16804a;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#172554;color:white;padding:24px 18px}header .wrap,main{max-width:850px;margin:auto}h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px}header p{margin:0;color:#dbeafe}
main{padding:22px 16px 50px}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:14px}
.track{height:8px;background:#e0e7f3;border-radius:99px;overflow:hidden;margin:8px 0 20px}.bar{height:100%;background:var(--blue);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 28px #1c31500b}
.kicker{color:var(--blue);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.07em}.question{font-size:clamp(19px,3vw,23px);font-weight:700;white-space:pre-wrap;margin:9px 0 22px}.options{display:grid;gap:10px}.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;color:inherit;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){border-color:#8ba4fa;background:#f8faff}.letter{flex:0 0 28px;height:28px;border-radius:8px;background:#edf1f8;display:grid;place-items:center;font-weight:700;font-size:13px}.opt.correct{border-color:#43a879;background:#effaf4}.opt.correct .letter{background:#16804a;color:white}.opt.wrong{border-color:#df756b;background:#fff3f2}.opt.wrong .letter{background:#c0392b;color:white}.opt:disabled{cursor:default}
.feedback{display:none;margin-top:20px;padding:17px;border-radius:12px;background:#f0f5ff;border:1px solid #d6e2ff}.feedback.show{display:block}.feedback h3{margin:0 0 8px;font-size:17px}.feedback p{margin:6px 0}.good{color:var(--green)}.bad{color:var(--red)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:10px;padding:12px 17px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e8edf6;color:#26334b}.btn:disabled{opacity:.4;cursor:not-allowed}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:14px}.result{display:none;text-align:center}.result.show{display:block}.score{font-size:48px;font-weight:800;color:var(--blue);margin:8px}.hide{display:none!important}code{background:#e9edf5;border-radius:4px;padding:2px 5px;font-size:.92em;overflow-wrap:anywhere}
@media(max-width:520px){header{padding:20px 16px}.card{border-radius:14px}.opt{padding:11px 12px}}
</style></head><body>
<header><div class="wrap"><h1>Web Development Quiz</h1><p>Ôn tập HTML, CSS, JavaScript, Node.js, Express, React và MongoDB</p></div></header>
<main>
<div class="top"><span id="counter">Câu 1</span><span id="scoreLive">Đúng: 0 / 0 đã trả lời</span></div><div class="track"><div class="bar" id="bar"></div></div>
<section class="card" id="quiz"><div class="kicker" id="kicker">Câu hỏi</div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" id="skip">Bỏ qua</button><button class="btn primary" id="next" disabled>Câu tiếp theo →</button></div><div class="bottom"><span>Chọn một đáp án để xem đáp án đúng và giải thích.</span><button class="btn secondary" id="restartTop">Làm lại / đảo câu</button></div></section>
<section class="card result" id="result"><div class="kicker">Hoàn thành</div><h2>Bạn đã hoàn thành bộ câu hỏi!</h2><div class="score" id="finalScore"></div><p id="finalText"></p><div class="actions" style="justify-content:center"><button class="btn primary" id="again">Làm lại với thứ tự mới</button></div></section>
</main>
<script>
const bank=[{"q": "In the context of the GET method, what type of data format can the response typically be returned as?", "opts": ["TXT/CSV", "HTML/XML", "XML/JSON", "CSV/JSON"], "a": 2, "exp": "GET thường trả về tài nguyên/dữ liệu; API hiện đại thường dùng JSON, còn XML cũng là định dạng phổ biến. Trong các lựa chọn, XML/JSON là phù hợp nhất."}, {"q": "Which CSS selector will target only the last list item?", "opts": ["ul:nth-child(last) {}", "ul:last-child li {}", "ul li:last-child {}", "ul:last-child(li) {}"], "a": 2, "exp": "Pseudo-class :last-child chọn phần tử là con cuối cùng của cha. `ul li:last-child` nhắm tới li cuối trong mỗi danh sách ul."}, {"q": "What key feature of Node.js is crucial for building REST APIs?", "opts": ["Access to the DOM", "Managing HTTP requests and server-side functionality", "Handling client-side events", "File management"], "a": 1, "exp": "Node.js cho phép chạy JavaScript phía máy chủ và xử lý HTTP request/response, nền tảng để xây dựng REST API."}, {"q": "Inline elements are normally displayed without starting a new line.", "opts": ["True", "False"], "a": 0, "exp": "Inline elements nằm cùng dòng với nội dung xung quanh; chúng không tự bắt đầu một dòng mới như block elements."}, {"q": "What is the correct HTML for inserting an image?", "opts": ["<img href=\"image.gif\" alt=\"My Image\">", "<image src=\"image.gif\" alt=\"My Image\">", "<img alt=\"My Image\">image.gif</img>", "<img src=\"image.gif\" alt=\"My Image\">"], "a": 3, "exp": "Thẻ `img` dùng thuộc tính `src` để chỉ đường dẫn ảnh và `alt` để cung cấp văn bản thay thế."}, {"q": "In HTML, which attribute is used to specify that an input field must be filled out?", "opts": ["placeholder", "validate", "formvalidate", "required"], "a": 3, "exp": "`required` là thuộc tính HTML boolean khiến trình duyệt yêu cầu người dùng nhập giá trị trước khi gửi form."}, {"q": "Which HTML tag is used to define an internal style sheet?", "opts": ["<style>", "<css>", "<sheet type=\"text/css\">", "<script>"], "a": 0, "exp": "Thẻ `<style>` đặt CSS nội bộ trong tài liệu HTML, thường nằm trong `<head>`."}, {"q": "Which tag pair is used to link web pages to each other?", "opts": ["<link></link>", "<url></url>", "<a></a>", "<hyperlink></hyperlink>"], "a": 2, "exp": "Thẻ `<a>` (anchor) tạo liên kết; thuộc tính `href` chỉ đích đến."}, {"q": "What is the correct HTML for creating a hyperlink?", "opts": ["<a url=\"[http://fit.hanu.vn](http://fit.hanu.vn)\">fit.hanu.vn</a>", "<a address=\"[http://fit.hanu.vn](http://fit.hanu.vn)\">HANU FIT</a>", "<a href=\"[http://fit.hanu.vn](http://fit.hanu.vn)\">FIT</a>", "<a src=\"[http://fit.hanu.vn](http://fit.hanu.vn)\">[http://fit.hanu.vn](http://fit.hanu.vn)</a>"], "a": 2, "exp": "Thuộc tính `href` của thẻ `<a>` chứa URL cần mở khi người dùng nhấn liên kết."}, {"q": "What is the correct HTML for making a text input field?", "opts": ["<input type=\"textfield\">", "<textfield>", "<input type=\"text\">", "<textinput type=\"text\">"], "a": 2, "exp": "`<input type=\"text\">` tạo ô nhập văn bản một dòng."}, {"q": "Which type of CSS is coded in the body of the web page as an attribute of an HTML tag?", "opts": ["inline", "embedded", "external", "imported"], "a": 0, "exp": "Inline CSS được viết trực tiếp trong thuộc tính `style` của một thẻ HTML."}, {"q": "How do you select an element with id \"demo\"?", "opts": [".demo", ":demo", "#demo", "demo"], "a": 2, "exp": "Selector `#demo` chọn phần tử có `id=\"demo\"`; dấu `.` dùng cho class."}, {"q": "Which CSS property is used to change the text color of an element?", "opts": ["foreground-color", "text-color", "color", "fgcolor"], "a": 2, "exp": "Thuộc tính CSS `color` điều khiển màu chữ. `background-color` mới điều khiển màu nền."}, {"q": "How can you created rounded corners using CSS3?", "opts": ["border-radius: 8px;", "border [round]: 8px;", "corner-effect: round;", "alpha-effect: round-corner;"], "a": 0, "exp": "`border-radius` bo tròn góc của đường viền/hộp phần tử."}, {"q": "Which of the following is not a property of Flex box?", "opts": ["align-items", "justify-spacing", "justify-content", "flex-direction"], "a": 1, "exp": "`justify-spacing` không phải thuộc tính Flexbox hợp lệ. Các thuộc tính chuẩn gồm `align-items`, `justify-content`, `flex-direction`."}, {"q": "How do you call a function named myFunction?", "opts": ["call function myFunction()", "call myFunction()", "myFunction()", "myFunction.run()"], "a": 2, "exp": "Gọi hàm JavaScript bằng tên hàm kèm ngoặc: `myFunction()`."}, {"q": "Which of the following will assign the value 5 to the variable productCost?", "opts": ["productCost <= 5;", "productCost = 5;", "productCost == 5;", "productCost => 5;"], "a": 1, "exp": "Dấu `=` là toán tử gán; `==` so sánh bằng, còn `<=` và `=>` không phải phép gán giá trị."}, {"q": "What is the correct way to write a JavaScript array?", "opts": ["let colors = \"red\", \"green\", \"blue\"", "let colors = 1 = (\"red\"), 2 = (\"green\"), 3 = (\"blue\")", "let colors = [\"red\", \"green\", \"blue\"]", "let colors = (1:\"red\", 2:\"green\", 3:\"blue\")"], "a": 2, "exp": "Mảng JavaScript được viết bằng dấu ngoặc vuông và các phần tử phân cách bằng dấu phẩy."}, {"q": "Inside which HTML element do we put the JavaScript?", "opts": ["<javascript>", "<script>", "<js>", "<scripting>"], "a": 1, "exp": "JavaScript trong HTML thường được đặt trong thẻ `<script>`."}, {"q": "Which method of the window object can be used to display a message to the user?", "opts": ["alert()", "display()", "message()", "status()"], "a": 0, "exp": "`window.alert()` mở hộp thoại thông báo cho người dùng."}, {"q": "When the user moves the mouse pointer away from a link it had been hovering over, the browser detects which one of these events?", "opts": ["mouseup", "mouseaway", "mouseoff", "mouseout"], "a": 3, "exp": "`mouseout` xảy ra khi con trỏ rời khỏi một phần tử; `mouseup` là khi nhả nút chuột."}, {"q": "What is the function to stop an interval timer?", "opts": ["stopTimer", "clearInterval", "clearTimer", "shutdown Timer"], "a": 1, "exp": "`clearInterval(id)` dừng interval đã tạo bằng `setInterval()`."}, {"q": "What is the default HTTP method used by the fetch function?", "opts": ["GET", "Request", "FormData", "POST"], "a": 0, "exp": "`fetch()` mặc định gửi request GET nếu không chỉ định `method` trong options."}, {"q": "Which of the following best describes x? let x = await fetch(URL);", "opts": ["A Promise object", "An object parsed from JSON", "The response text", "An object which contains the meta data of the response"], "a": 3, "exp": "Vì có `await`, biến `x` nhận về đối tượng `Response` sau khi request hoàn tất; nó chứa status, headers và các phương thức đọc body như `json()`."}, {"q": "What is Node.js?", "opts": ["A Java-based framework", "A network application framework", "A web server", "A JavaScript-based framework"], "a": 3, "exp": "Node.js là môi trường chạy JavaScript ngoài trình duyệt, thường dùng phía server. Trong các lựa chọn, đáp án JavaScript-based là gần đúng nhất."}, {"q": "How do you install global packages with npm?", "opts": ["npm install -1 <package-name>", "npm global  <package-name>", "npm install -g  <package-name>", "npm install -global  <package-name>"], "a": 2, "exp": "Cờ `-g` cài package toàn cục: `npm install -g <package-name>`."}, {"q": "Node.js runs on?", "opts": ["Client", "Server", "Both Client and Server", "Browser"], "a": 1, "exp": "Node.js thường chạy ở phía server, dù runtime JavaScript cũng có thể chạy ở nhiều môi trường khác."}, {"q": "What is callback?", "opts": ["A function that is passed as an argument to another function.", "A backend endpoint's URL.", "An API call to the backend.", "An asynchronous equivalent for a function."], "a": 0, "exp": "Callback là hàm được truyền vào hàm khác để được gọi sau đó, thường khi một tác vụ hoàn tất hoặc một sự kiện xảy ra."}, {"q": "Which of these is not a core feature of Express?", "opts": ["Templating", "Routing", "ORM", "Middleware"], "a": 2, "exp": "ORM không phải tính năng lõi của Express; ORM thường do thư viện riêng cung cấp. Express tập trung vào routing và middleware."}, {"q": "Where can you access the capture values of URL parameters?", "opts": ["From the req.query object", "From the req.params object", "From the req.data object", "From the req.body object"], "a": 1, "exp": "Express lưu các đoạn URL khớp với route parameters trong `req.params`, ví dụ `/users/:id` tạo `req.params.id`."}, {"q": "To serve static files like images, CSS files, and JavaScript files in Express, you use:", "opts": ["res.sendFile()", "express.static()", "res.sendStatic()", "app.static()"], "a": 1, "exp": "`express.static()` là middleware phục vụ tệp tĩnh như ảnh, CSS và JavaScript từ một thư mục."}, {"q": "Which middleware in Express.js helps in handling JSON data from POST requests?", "opts": ["express.data()", "express.json()", "express.urlencoded()", "express.parse()"], "a": 1, "exp": "`express.json()` phân tích request body dạng JSON và đưa dữ liệu vào `req.body`."}, {"q": "How do you retrieve the value of a specific cookie sent in a request in Express.js?", "opts": ["req.cookie.value", "req.values.cookieName", "req.get('cookieName')", "req.cookies[cookieName]"], "a": 3, "exp": "Với middleware cookie-parser đã được cấu hình, cookie cụ thể được đọc bằng `req.cookies[cookieName]`."}, {"q": "In Express, if you want a middleware function to be executed for every request, where would you place it?", "opts": ["Inside each route definition", "Inside the app's main file", "Before all route definitions", "At the end of all route definitions"], "a": 2, "exp": "Đăng ký middleware bằng `app.use(...)` trước các route để nó có cơ hội chạy cho mọi request phù hợp."}, {"q": "What is the method that allows you to write content to a file?", "opts": ["fs.write", "fs.output", "fs.writeFile", "fs.writeOut"], "a": 2, "exp": "`fs.writeFile()` ghi dữ liệu vào tệp; có phiên bản callback và phiên bản promise."}, {"q": "Which of the following Node modules is required for working with files and directories on the server?", "opts": ["os", "fs", "files", "system"], "a": 1, "exp": "Module lõi `fs` (file system) cung cấp các thao tác đọc/ghi tệp và thư mục."}, {"q": "Which of the following is not a valid HTTP method?", "opts": ["HEADER", "PUT", "GET", "POST"], "a": 0, "exp": "`HEADER` không phải HTTP method chuẩn phổ biến; `HEAD` mới là method hợp lệ."}, {"q": "JSX stands for?", "opts": ["JavaScript executable", "JavaScript XML", "JointScript XML", "JavaScreenXML"], "a": 1, "exp": "JSX viết tắt của JavaScript XML, cú pháp mở rộng dùng để mô tả cấu trúc UI trong React."}, {"q": "React separates the user interface into components. How are components combined to create a user interface?", "opts": ["By putting them in a folder structure", "By nesting components", "With webpack", "With code splitting"], "a": 1, "exp": "Các component được ghép bằng cách lồng component này bên trong component khác."}, {"q": "What is a hook in React?", "opts": ["A hook helps you use state and lifecycle methods behavior in functional components", "A hook helps you customize a component", "A hook lets you hook up components to events", "A hook helps you create component's lifecycle"], "a": 0, "exp": "Hooks như `useState` và `useEffect` cho phép function component dùng state và các hành vi liên quan đến vòng đời/tác dụng phụ."}, {"q": "What is the <></> tag called in React?", "opts": ["Grouper", "Empty", "Fragment", "Shard"], "a": 2, "exp": "`<></>` là cú pháp ngắn của React Fragment, nhóm nhiều phần tử mà không thêm node DOM bao ngoài."}, {"q": "React can only render elements in the root document element.", "opts": ["True", "False"], "a": 1, "exp": "React có thể render vào một root DOM element, nhưng không có nghĩa toàn bộ ứng dụng chỉ được phép render vào một root duy nhất."}, {"q": "Choose the best HTML element to define italic text", "opts": ["<strong>", "<ca>", "<b>", "<i>"], "a": 3, "exp": "`<i>` biểu thị văn bản in nghiêng về mặt trình bày; `<em>` thường được ưu tiên khi muốn nhấn mạnh ngữ nghĩa."}, {"q": "How we call a data record in MongoDB?", "opts": ["Collection", "Document", "Row", "Table"], "a": 1, "exp": "Một bản ghi trong MongoDB được gọi là document; nhiều document nằm trong collection."}, {"q": "Which of these lines of code works in NodeJS?", "opts": ["const button = document.querySelector(\"button\");", "console.log(\"VS\");", "const name VB;", "None of these"], "a": 1, "exp": "`console.log(\"VS\")` chạy trong Node.js. `document.querySelector` cần DOM của trình duyệt, còn `const name VB` sai cú pháp."}, {"q": "Which of the following command can be used in mongo shell to show all the collections in your selected MongoDB database?", "opts": ["show db -all", "show collections", "show databases", "show dbs"], "a": 1, "exp": "`show collections` liệt kê các collection trong database đang được chọn ở mongo shell."}, {"q": "Which of these is correct to define an array in JavaScript?", "opts": ["int[] list = new int[]{1,2,3);", "let list = [1,2,3];", "const list = (1,2,3);", "int[] list = new Array(1,2,3);"], "a": 1, "exp": "Cú pháp mảng JavaScript hợp lệ là `let list = [1,2,3];`."}, {"q": "What is the correct JavaScript syntax to change the content of the following element?\n<p id=\"demo\">This is a demonstration.</p>", "opts": ["document.querySelector(\"#demo\").innerHTML= \"Hello World!\";", "document.querySelectorAll(\",demo\").textContent = \"Hello World!\";", "document.querySelectorAll(\"#demo\").textContent = \"Hello World!\";", "document.querySelector(\".demo\").innerHTML = \"Hello World!\";"], "a": 0, "exp": "`querySelector(\"#demo\")` chọn phần tử có id demo; sau đó `innerHTML` cập nhật nội dung của phần tử."}, {"q": "In ReactJS, state can be used to pass", "opts": ["Event handler to component", "None of these", "Both of these", "Properties to the component"], "a": 3, "exp": "State là dữ liệu nội bộ của component, không phải cơ chế truyền props từ component cha sang con. Props được dùng để truyền dữ liệu xuống component."}, {"q": "Which of these is correct about HTML block elements?", "opts": ["Small amount of content, no height or width", "Small amount of content, has height and width", "Take up the full width of the page (flows top to bottom)", "Large blocks of content, has height and width"], "a": 2, "exp": "Block elements thường chiếm toàn bộ chiều rộng khả dụng và bắt đầu trên dòng mới."}, {"q": "Which of the following statements executes the code of abc.js", "opts": ["node abc.js", "None of these", "abc.js", "nodejs abc"], "a": 0, "exp": "Lệnh `node abc.js` chạy tệp JavaScript bằng Node.js."}, {"q": "Which of these is a valid built-in event in JavaScript?", "opts": ["onSubmit", "click", "onClick", "onChange"], "a": 1, "exp": "Trong JavaScript DOM, tên sự kiện là `click`; `onClick` là cách đặt tên thường gặp trong JSX/React, còn HTML event handler có dạng `onclick`."}, {"q": "As soon as the props of a React component are changed, the component will:", "opts": ["do nothing, you must call render method to render the component", "be created again from scratch", "re-render the component", "None of these"], "a": 2, "exp": "Khi props thay đổi, React thường render lại component để giao diện phản ánh dữ liệu mới."}, {"q": "Which of the following is a template engine for Node js?", "opts": ["Mongoose", "Handlebars", "None of these", "ReactJS"], "a": 0, "exp": "Handlebars là một template engine có thể dùng trong ứng dụng Node.js."}, {"q": "React Lifecycle method componentDidMount() is called when", "opts": ["Component is rendered for the first time", "Both of these", "State of the component is updated", "None of these"], "a": 1, "exp": "`componentDidMount()` chạy sau lần render đầu tiên của class component, phù hợp cho tác vụ như gọi API."}, {"q": "The variables, functions in Nodejs modules can be exposed using", "opts": ["module", "module.expose", "module.exports", "All of them"], "a": 2, "exp": "`module.exports` xác định giá trị mà một module CommonJS xuất ra để module  "a": 0, "exp": "React là thư viện JavaScript dùng xây dựng giao diện người dùng, không phải framework đầy đủ theo nghĩa truyền thống."}, {"q": "Where in an HTML document is the preferred place to refer to an external JS file?", "opts": ["At the beginning of <body> section", "At the end of <body> section", "At the end of the document", "In the <head> section"], "a": 1, "exp": "Đặt script ở cuối <body> là cách truyền thống để HTML hiển thị trước khi script chạy; với script hiện đại có thể dùng defer trong <head>."}, {"q": "Which of these correctly describe the output of the code below?\nimg { display: block; width: 200px; }\n(There are five identical img elements.)", "opts": ["5 images display on 1 line, each image takes up 200px", "5 images display on 5 lines, each image takes up 50px", "5 images display on 5 lines, each image takes up 200px", "5 images display on 1 line, each image takes up 50px"], "a": 2, "exp": "Đặt script ở cuối `<body>` là cách truyền thống để HTML hiển thị trước khi script chạy; với script hiện đại có thể dùng `defer` trong `<head>`."}, {"q": "Which of these correctly describe the output of the CSS code below?\ndiv { padding: 10px 5px; }", "opts": ["Space between the border and the content of the div is respectively, top & bottom: 10px left & right: 5px", "Space between the border and the content of the div is respectively, top & bottom: 5px left & right: 10px", "Space between the border and the content of the div is respectively, top & right: 10px, bottom & left: 5px", "Space between the border and the content of the div is respectively, top & left: 5px, bottom & right: 10px"], "a": 0, "exp": "`display: block` khiến mỗi ảnh chiếm một dòng. `width: 200px` đặt chiều rộng mỗi ảnh là 200px."}, {"q": "What is the correct HTML for creating an internal link (linked within the same webpage) to the bookmark named css?", "opts": ["<a href=\"#css\">Lession 2. CSS</a>", "<link href=\"css\">Lession 2. CSS</a>", "<a name=\"css\">Lession 2. CSS</a>", "<a id=\"css\">Lession 2. CSS</a>"], "a": 0, "exp": "Cú pháp `padding: 10px 5px` nghĩa là trên/dưới 10px và trái/phải 5px."}];
let order=[],pos=0,answered=new Map(),score=0;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle(bank.map((_,i)=>i));pos=0;answered=new Map();score=0;$('quiz').classList.remove('hide');$('result').classList.remove('show');render()}
function render(){
 if(pos>=order.length){finish();return}
 const q=bank[order[pos]];$('counter').textContent=`Câu ${pos+1} / ${order.length}`;$('kicker').textContent=`Câu hỏi ${pos+1}`;$('question').textContent=q.q;$('options').innerHTML='';$('feedback').className='feedback';$('feedback').innerHTML='';$('next').disabled=true;$('next').textContent=pos===order.length-1?'Xem kết quả':'Câu tiếp theo →';$('skip').disabled=false;
 q.opts.forEach((opt,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span>`;b.onclick=()=>choose(i);$('options').appendChild(b)});
 $('bar').style.width=(pos/order.length*100)+'%';updateScore()
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(i){if(answered.has(order[pos]))return;const q=bank[order[pos]],correct=i===q.a;answered.set(order[pos],i);if(correct)score++;
 [...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===i&&!correct)b.classList.add('wrong')});
 $('feedback').className='feedback show';$('feedback').innerHTML=`<h3 class="${correct?'good':'bad'}">${correct?'✓ Chính xác!':'✗ Chưa chính xác.'} Đáp án đúng: ${String.fromCharCode(65+q.a)}.</h3><p><strong>Đáp án:</strong> ${escapeHtml(q.opts[q.a])}</p><p><strong>Giải thích chi tiết:</strong> ${escapeHtml(q.exp)}</p>`;$('next').disabled=false;$('skip').disabled=true;updateScore()
}
function updateScore(){$('scoreLive').textContent=`Đúng: ${score} / ${answered.size} đã trả lời`}
function next(){pos++;render()}
function finish(){$('quiz').classList.add('hide');$('result').classList.add('show');$('bar').style.width='100%';$('counter').textContent='Đã hoàn thành';$('scoreLive').textContent=`Đúng: ${score} / ${answered.size} đã trả lời`;$('finalScore').textContent=`${score} / ${bank.length}`;$('finalText').textContent=`Bạn đã trả lời ${answered.size} trên ${bank.length} câu. Tỷ lệ đúng trên số câu đã trả lời: ${answered.size?Math.round(score/answered.size*100):0}%.`;}
$('next').onclick=next;$('skip').onclick=()=>{pos++;render()};$('restartTop').onclick=start;$('again').onclick=start;start();
</script></body></html>
